# Librarium — MariaDB + Laravel API + Angular SPA behind nginx.
# Bring the stack up with ./run.sh (which prepares the .env files first).

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Base Laravel config from backend/.env; the values below win over it
    # (Laravel's dotenv is immutable, so real environment variables take
    # precedence) to point the app at the MariaDB service.
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://${APP_HOST}:${APP_PORT}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      PHP_CLI_SERVER_WORKERS: "4"
      # Open the interactive API docs (/docs/api) to reviewers in the demo.
      API_DOCS_PUBLIC: "true"
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      target: app
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - backend

volumes:
  db-data:
