<div class="page">
  <lib-page-header title="Search results"
                   [subtitle]="query() ? total() + ' results for «' + query() + '»' : 'Type something to search'" />

  @if (loading()) {
    <lib-skeleton variant="rows" [rows]="4" />
  } @else if (error()) {
    <lib-error-state title="Could not run the search" (retry)="retry()" />
  } @else if (query() && results().length === 0) {
    <lib-empty-state icon="search_off" title="Nothing here"
                     [message]="'No results for «' + query() + '». Check the spelling, or try the ISBN.'" />
  } @else {
    <div class="results">
      @for (b of results(); track b.id) {
        <article class="card card-pad result">
          <div class="row">
            <div class="grow">
              <a class="title" [routerLink]="['/books', b.id]">{{ b.title }}</a>
              <div class="muted">{{ authorNames(b) }}</div>
              <div class="faint mono">{{ b.isbn }}</div>
              @if (matchedOn(b)) { <div class="matched">Matched on {{ matchedOn(b) }}</div> }
            </div>
            <lib-availability-badge [available]="b.available_copies" [total]="b.total_copies" />
          </div>
        </article>
      }
    </div>
  }
</div>
