<div class="page">
  <lib-page-header title="Categorías" [subtitle]="categories().length + ' categorías'">
    <button mat-flat-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon> Añadir categoría
    </button>
  </lib-page-header>

  <div class="toolbar">
    <lib-search-input placeholder="Buscar categorías…" (changed)="onSearch($event)" />
  </div>

  <div class="card">
    @if (categories().length === 0) {
      <lib-empty-state icon="category" title="Aún no hay categorías"
                       message="Las categorías hacen el catálogo navegable por materias."
                       actionLabel="Añadir categoría" (action)="openForm()" />
    } @else {
      <table class="lib-table" aria-label="Listado de categorías">
        <thead><tr><th>Nombre</th><th>Slug</th><th class="num">Libros</th><th class="actions-col"></th></tr></thead>
        <tbody>
          @for (c of categories(); track c.id) {
            <tr>
              <td class="strong">{{ c.name }}</td>
              <td class="mono muted">{{ c.slug }}</td>
              <td class="num mono">{{ c.books_count ?? 0 }}</td>
              <td class="actions-col">
                <button mat-icon-button (click)="openForm(c)" [attr.aria-label]="'Editar ' + c.name"><mat-icon>edit</mat-icon></button>
                <button mat-icon-button (click)="confirmDelete(c)" [attr.aria-label]="'Eliminar ' + c.name"><mat-icon>delete</mat-icon></button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
</div>
