<div class="page">
  <lib-page-header title="Categories" [subtitle]="meta().total + ' categories'">
    <button mat-flat-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon> Add category
    </button>
  </lib-page-header>

  <div class="toolbar">
    <lib-search-input placeholder="Search categories…" (changed)="onSearch($event)" />
  </div>

  @if (actionError()) {
    <lib-inline-alert tone="danger">{{ actionError() }}</lib-inline-alert>
  }

  <div class="card">
    @if (loading()) {
      <lib-skeleton variant="rows" [rows]="5" />
    } @else if (error()) {
      <lib-error-state title="Could not load the categories" (retry)="load()" />
    } @else if (categories().length === 0) {
      <lib-empty-state icon="category" title="No categories yet"
                       message="Categories make the catalogue browsable by subject."
                       actionLabel="Add category" (action)="openForm()" />
    } @else {
      <table class="lib-table" aria-label="Category list">
        <thead><tr><th>Name</th><th>Slug</th><th class="num">Books</th><th class="actions-col"></th></tr></thead>
        <tbody>
          @for (c of categories(); track c.id) {
            <tr>
              <td class="strong">{{ c.name }}</td>
              <td class="mono muted">{{ c.slug }}</td>
              <td class="num mono">{{ c.books_count ?? 0 }}</td>
              <td class="actions-col">
                <button mat-icon-button (click)="openForm(c)" [attr.aria-label]="'Edit ' + c.name"><mat-icon>edit</mat-icon></button>
                <button mat-icon-button (click)="confirmDelete(c)" [attr.aria-label]="'Delete ' + c.name"><mat-icon>delete</mat-icon></button>
              </td>
            </tr>
          }
        </tbody>
      </table>

      <mat-paginator [length]="meta().total" [pageIndex]="meta().current_page - 1"
                     [pageSize]="meta().per_page" [pageSizeOptions]="[15, 30, 50]"
                     (page)="onPage($event)" aria-label="Category pagination" />
    }
  </div>
</div>
